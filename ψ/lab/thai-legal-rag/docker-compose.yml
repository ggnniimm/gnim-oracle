services:
  qdrant:
    image: qdrant/qdrant:v1.17.1
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  app:
    build: .
    image: thai-legal-rag-app:latest
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file:
      - ../../../.env
    environment:
      - THAI_RAG_DATA_DIR=/app/data
      - QDRANT_URL=http://qdrant:6333
    volumes:
      - ./data:/app/data
    depends_on:
      - qdrant

volumes:
  qdrant_data:
