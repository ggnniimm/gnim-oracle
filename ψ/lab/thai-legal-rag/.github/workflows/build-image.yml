name: Build & Push Image

on:
  push:
    branches: [main]
    paths:
      - "ψ/lab/thai-legal-rag/src/**"
      - "ψ/lab/thai-legal-rag/app/**"
      - "ψ/lab/thai-legal-rag/requirements.txt"
      - "ψ/lab/thai-legal-rag/Dockerfile"
      - "ψ/lab/thai-legal-rag/.dockerignore"
      - ".github/workflows/build-image.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ggnniimm/thai-legal-rag-app

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ψ/lab/thai-legal-rag
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache,mode=max
